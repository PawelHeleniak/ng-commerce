<article class="article">
  <div class="article__wrapper">
    <section class="section">
      <div class="section__header">
        <h2>Polecane</h2>
        <a href="">Zobacz więcej <i class="fa-solid fa-chevron-right"></i></a>
      </div>
      <div class="section__box">
        <div class="slider">
          @for (item of products; track $index) { @if(item.place === 1){
          <button class="slider__item">
            <img [src]="item.img" [alt]="item.imgAlt" />
            <div class="slider__price">{{ item.price }}</div>
            <div class="slider__name">{{ item.model }}</div>
          </button>
          } }
        </div>
      </div>
    </section>
    <section class="section">
      <div class="section__header">
        <h2>Nowości</h2>
        <a href="">Zobacz więcej <i class="fa-solid fa-chevron-right"></i></a>
      </div>
      <div class="section__box">
        <div class="slider">
          @for (item of products; track $index) { @if(item.place === 2){
          <button class="slider__item">
            <img [src]="item.img" [alt]="item.imgAlt" />
            <div class="slider__price">{{ item.price }}</div>
            <div class="slider__name">{{ item.model }}</div>
          </button>
          } }
        </div>
      </div>
    </section>
    <section class="section">
      <div class="section__header">
        <h2>Promocje</h2>
        <a href="">Zobacz więcej <i class="fa-solid fa-chevron-right"></i></a>
      </div>
      <div class="section__box">
        <div class="slider">
          @for (item of products; track $index) { @if(item.place === 3){
          <button class="slider__item">
            <img [src]="item.img" [alt]="item.imgAlt" />
            <div class="slider__price">{{ item.price }}</div>
            <div class="slider__name">{{ item.model }}</div>
          </button>
          } }
        </div>
      </div>
    </section>
  </div>
</article>
